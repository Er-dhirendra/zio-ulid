name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: sbt

      - name: Install sbt              # ← REPLACE sbt/setup-sbt@v1 with this
        run: |
          curl -fL https://github.com/sbt/sbt/releases/download/v1.10.2/sbt-1.10.2.tgz \
            | tar xz -C /usr/local
          echo "/usr/local/sbt/bin" >> $GITHUB_PATH

      - name: Verify sbt               # ← sanity check
        run: sbt --version

      - name: Publish
        run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}